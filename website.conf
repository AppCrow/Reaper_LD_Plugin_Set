# Website reaperldtools.appcrow.at: gebaut, geprüft und hochgeladen vom
# Werkzeug-Repo AppCrow/appcrow_webtool, ausgecheckt neben diesem Repo
# (Code Factory/appcrow_webtool). Aufruf: ./scripts/website/veroeffentlichen.sh
# Aufbau dieser Datei: appcrow_webtool/werkzeug/konfig.py
# Gerüst 2026-10-23 (Chat „App Crow Website“); Texte noch nicht freigegeben.

[werkzeug]
# Tag im Werkzeug-Repo, mit dem diese Seite gebaut wird. Hochgeladen wird
# nur, wenn das Werkzeug genau auf diesem Tag steht.
version = v5
bau = website/_bau
zugang = website/ziel.conf
angaben = website/angaben.conf
# Impressum und Datenschutz liegen im Repo AppCrow/appcrow; Verweise
# dorthin prüft das Werkzeug am echten Server (nur lesen).
online = appcrow.at

[reaperldtools.appcrow.at]
quelle = website/seite
# Dokumentstamm der Subdomain in Plesk (angelegt von Tobi, TT-61 2026-10-22); vor dem
# ersten Hochladen in Plesk nachsehen.
server = reaperldtools.appcrow.at/httpdocs
# stil.css für alle Seiten, das AppCrow-Symbol für die Fußzeile (A2 dunkel, A1 hell).
gemeinsam = stil.css appcrow-symbol-a2.png appcrow-symbol-a1.png
# Je Bild, das die Seite einbindet, eine Zeile; kante mindestens doppelte
# angezeigte Größe (Icon bis 56 → 256 wie bei Binderdock; Favicon 64).
# Icon: design/material/AppIcon-1024.png (freigegeben von Tobi 2026-10-22), volles Quadrat ohne
# Alpha mit dunklen Ecken, darum rundet die Seite (inhalt.js iconRund: true).
# Bildschirmfotos: die vier neutralen Aufnahmen aus design/material/, so wie geliefert
# (Tobi, TT-62 2026-10-22). Kein Video (entschieden 2026-10-20).
# Download: kein eigener; die Knöpfe zeigen auf GitHub Releases (TT-63, 2026-10-22).
# Großbild (Klick aufs Galerie-Bild): eigene Fassung aus den Originalen in src-neutral/, quer
# und ohne Rand, 2200 px bei Qualität 80, so unter 400 KB je Bild (Regel „bild“ in produkt-pruefen.py;
# Tobi 2026-10-23 „nicht groß genug“; inhalt.js gross, produkt.js data-gross).
# favicon.ico (16, 32, 48 px) liegt fertig in website/seite/: das Werkzeug schreibt kein ICO.
# Neu bauen, wenn sich das Icon ändert (Repo App Crow, Ordner Website):
#   python3 scripts/favicon-ico.py <dieses Repo>/design/material/AppIcon-1024.png <dieses Repo>/website/seite/favicon.ico
# Ersetzt Plesks Standard-favicon.ico; geprüft von scripts/favicon-pruefen.py in check.sh.
medien =
    design/material/AppIcon-1024.png -> assets/reaperldtools-icon.png kante 256
    design/material/AppIcon-1024.png -> favicon.png kante 64
    design/material/ld-tools-neutral-en-[1-4]-*.png -> medien/ jpeg 1000 82
    design/material/src-neutral/ld-tools-[1-4]-*.png -> medien/gross/ jpeg 2200 80
